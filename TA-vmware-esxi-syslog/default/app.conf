# TA-vmware-esxi-syslog
[install]
build = 1
is_configured = false

[launcher]
author = Nikhil Chawla
description = Search-time fields and CIM mappings for VMware ESXi syslog (sourcetypes vmware:esxlog:<process>): Authentication for host agent, SSH and DCUI logins, Change for vSphere tasks and host audit records, Alerts for host problems and account lockouts, Web for remote requests to the host. Parses the header, Originator block and messages of more than 100 ESXi processes. Not affiliated with Broadcom or VMware.
version = 1.0.0

[ui]
is_visible = false
label = VMware ESXi Syslog Fields and CIM Add-on

[package]
id = TA-vmware-esxi-syslog
check_for_updates = true

[id]
name = TA-vmware-esxi-syslog
version = 1.0.0
