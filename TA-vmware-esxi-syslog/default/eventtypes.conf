# Event types for VMware ESXi syslog (sourcetypes vmware:esxlog:<process>).
# Sourcetype values in searches are not case-sensitive, so vmware:esxlog:Hostd also matches hostd.

# Logins to the host agent (vSphere API / Host Client), SSH and failed DCUI logins: Authentication
[esxi_authentication]
search = (sourcetype="vmware:esxlog:Hostd" OR sourcetype="vmware:esxlog:sshd" OR sourcetype="vmware:esxlog:vobd") esxi_auth_result=*

# The same logins by root: Authentication.Privileged_Authentication
[esxi_authentication_privileged]
search = (sourcetype="vmware:esxlog:Hostd" OR sourcetype="vmware:esxlog:sshd" OR sourcetype="vmware:esxlog:vobd") esxi_auth_result=* user="root"

# Host agent session start and end (login time, API call count, user agent). Not tagged: the
# login itself is already counted by esxi_authentication.
[esxi_session]
search = (sourcetype="vmware:esxlog:Hostd" OR sourcetype="vmware:esxlog:sshd") session_action=*

# Tasks that change something (snapshots, power, reconfigure, register, remove, maintenance mode,
# services...). The "Task Created" record carries the user; read-only API calls are left out.
# The result is in the matching "Task Completed" record (same esxi_task_id).
[esxi_task_change]
search = sourcetype="vmware:esxlog:Hostd" esxi_task_state="Created" esxi_task_readonly="false"

# Account and permission changes made through tasks: Change.Account_Management
[esxi_task_account_change]
search = sourcetype="vmware:esxlog:Hostd" esxi_task_state="Created" esxi_task_readonly="false" (object_category="user" OR object_category="permission")

# Host configuration audit records from vobd (esx.audit.*): SSH or shell enabled, firewall
# changes, maintenance mode, boot, password changes...
[esxi_audit_change]
search = sourcetype="vmware:esxlog:vobd" esxi_vob_category="change"

# Firewall and network audit records: Change.Network_Changes
[esxi_audit_network_change]
search = sourcetype="vmware:esxlog:vobd" esxi_vob_category="change" object_category="network"

# Account audit records (lockouts, password changes): Change.Account_Management
[esxi_audit_account]
search = sourcetype="vmware:esxlog:vobd" vob_id="esx.audit.*" object_category="user" action=*

# Problems reported by the host (esx.problem.*) and account lockouts / repeated login failures
[esxi_alert]
search = sourcetype="vmware:esxlog:vobd" esxi_vob_category="alert"

# Requests to the host's web services through its reverse proxy, from other machines (Web).
# Requests from the host to itself (127.0.0.1) are left out.
[esxi_web]
search = sourcetype="vmware:esxlog:envoy-access" http_method=* NOT src="127.0.0.1" NOT src="[::1]"

# Commands run over SSH or in the ESXi Shell (not tagged)
[esxi_command]
search = (sourcetype="vmware:esxlog:sshd" OR sourcetype="vmware:esxlog:shell") command=*
