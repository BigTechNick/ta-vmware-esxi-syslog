# Search-time settings for VMware ESXi syslog. Generated by tools/gen_conf.py.
#
# ESXi sends one log stream per process, and the usual parsing (for example the Splunk Add-on
# for VMware ESXi Logs) names each sourcetype vmware:esxlog:<process>. Splunk has no wildcard
# sourcetype stanzas, so each known process has its own stanza. To parse another process,
# copy the [vmware:esxlog:syslog] stanza into local/props.conf under the new name.
#
# KV_MODE = none: the Originator block (sub=, opID=, user=) is parsed by name instead, so that
# automatic key=value extraction does not create a conflicting 'user' field.

[vmw-syslog]
KV_MODE = none
REPORT-esxi = esxi_header, esxi_header_5424, esxi_level, esxi_level_pid, esxi_sd_sub, esxi_sd_opid, esxi_sd_sid, esxi_sd_user, esxi_sd_reason
EVAL-app = lower(process)
EVAL-dest = host
EVAL-dvc = host
EVAL-log_level = case(lower(log_level)=="warn", "warning", lower(log_level)=="err", "error", lower(log_level)=="crit", "critical", true(), lower(log_level))
EVAL-product = "ESXi"
EVAL-syslog_facility = mvindex(split("kern,user,mail,daemon,auth,syslog,lpr,news,uucp,cron,authpriv,ftp,ntp,security,console,solaris-cron,local0,local1,local2,local3,local4,local5,local6,local7", ","), floor(tonumber(syslog_pri) / 8))
EVAL-syslog_severity = mvindex(split("emergency,alert,critical,error,warning,notice,informational,debug", ","), tonumber(syslog_pri) % 8)
EVAL-vendor = "VMware"
EVAL-vendor_product = "VMware ESXi"

