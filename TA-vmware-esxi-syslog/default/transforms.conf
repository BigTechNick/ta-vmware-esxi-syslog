# Search-time field extractions for VMware ESXi syslog. Generated by tools/gen_conf.py.
# Every regex uses named groups; each group becomes a field.

# RFC 3164 style header: [<PRI>][time host ]process[pid]: message. The time may be classic or ISO;
# PRI, time and host are optional, for syslog servers that write files without them.
# Also handles ESXi 7/8's 'Process: level process[pid] [Originator@6876 ...]' layout, script
# names with a pid suffix (backup.sh.123:) and 'Host Profiles[123 opID=x]:'.
[esxi_header]
REGEX = ^(?:<(?<syslog_pri>\d{1,3})>)?(?:(?:\d{4}-\d\d-\d\dT[\d:.]+(?:Z|[+-]\d\d:?\d\d)?|[A-Z][a-z]{2} [ \d]\d \d\d:\d\d:\d\d) \S+ )?(?<process>[^\s\[:]+?(?: [A-Z][a-z]+)?)(?:\.\d+\.?)?(?:\[(?<pid>\d+)(?:(?: [^\]\s]+)?\])?)?(?(<pid>)(?: ?:)?(?:\s|$)| ?:(?:\s|$))\s*(?:\"?\d{4}-\d\d-\d\dT\S+ )?(?:(?:trivia|verbose|debug|info|warning|warn|error|critical|panic|quiet|alert|notice) (?:-|[\w.-]+)\[\d+\] )?(?:\[vmsyslogd@\d+[^\]]*\] )?(?:\[(?:Originator|vSAN)@\d+(?:[^\[\]]|\[[^\]]*\])*\] ?)?(?<message>.*?)(?:#000)*$

# RFC 5424 header (ESXi 8 can send this layout): <PRI>1 time host app procid msgid [SD] message
[esxi_header_5424]
REGEX = ^(?:<(?<syslog_pri>\d{1,3})>)?1 \d{4}-\S+ \S+ (?<process>\S+) (?:(?<pid>\d+)|-) (?:-|(?<esxi_msgid>\S+)) (?:-|(?:\[(?:[^\[\]]|\[[^\]]*\])*\])+) ?(?:\[(?:Originator|vSAN)@\d+(?:[^\[\]]|\[[^\]]*\])*\] ?)?(?<message>.*?)(?:#000)*$

# Log level in the 'Process: level process[pid]' layout
[esxi_level]
REGEX = ^(?:<\d{1,3}>)?(?:(?:\d{4}-\d\d-\d\dT[\d:.]+(?:Z|[+-]\d\d:?\d\d)?|[A-Z][a-z]{2} [ \d]\d \d\d:\d\d:\d\d) \S+ )?[^\s\[:]+(?:\[\d+\])?: \"?(?:\d{4}-\d\d-\d\dT\S+ )?(?<log_level>trivia|verbose|debug|info|warning|warn|error|critical|panic|quiet|alert|notice) (?:-|[\w.-]+)\[\d+\]

# pid when it is only in the 'level process[pid]' part
[esxi_level_pid]
REGEX = ^(?:<\d{1,3}>)?(?:(?:\d{4}-\d\d-\d\dT[\d:.]+(?:Z|[+-]\d\d:?\d\d)?|[A-Z][a-z]{2} [ \d]\d \d\d:\d\d:\d\d) \S+ )?[^\s\[:]+: \"?(?:\d{4}-\d\d-\d\dT\S+ )?(?:trivia|verbose|debug|info|warning|warn|error|critical|panic|quiet|alert|notice) [\w.-]+\[(?<pid>\d+)\]

# Originator block: sub=
[esxi_sd_sub]
REGEX = \[(?:Originator|vSAN)@\d+ (?:[^\[\]]|\[[^\]]*\])*?\bsub=(?<esxi_sub>(?:[^\[\]]|\[[^\]]*\])+?)(?= \w+=|\])

# Originator block: opID=
[esxi_sd_opid]
REGEX = \[(?:Originator|vSAN)@\d+ (?:[^\[\]]|\[[^\]]*\])*?\bop[Ii][Dd]=(?<esxi_opid>(?:[^\[\]]|\[[^\]]*\])+?)(?= \w+=|\])

# Originator block: sid= (session)
[esxi_sd_sid]
REGEX = \[(?:Originator|vSAN)@\d+ (?:[^\[\]]|\[[^\]]*\])*?\bsid=(?<esxi_sid>\w+)

# Originator block: user=<ESXi user>[:<user it acts for, e.g. a vCenter user>]
[esxi_sd_user]
REGEX = \[(?:Originator|vSAN)@\d+ (?:[^\[\]]|\[[^\]]*\])*?\buser=(?<esxi_sd_user>(?<esxi_local_user>[^:\]\s]*)(?::(?<esxi_external_user>(?:[^\[\]]|\[[^\]]*\])*?))?)(?= \w+=|\])

# Originator block: reason=
[esxi_sd_reason]
REGEX = \[(?:Originator|vSAN)@\d+ (?:[^\[\]]|\[[^\]]*\])*?\breason=(?<esxi_sd_reason>(?:[^\[\]]|\[[^\]]*\])+?)(?= \w+=|\])

# vmacore connection objects: <TCP 'local : port'>, <TCP 'remote : port'>
[esxi_tcp_pair]
REGEX = <TCP '(?<local_ip>[^' ]+) : (?<local_port>\d+)'>, <TCP '(?<remote_ip>[^' ]+) : (?<remote_port>\d+)'>

# Path of a VM's .vmx file
[esxi_vm_path]
REGEX = (?<vm_path>/vmfs/volumes/[^\s\"']+?\.vmx)\b

# First storage device ID in the message
[esxi_device]
REGEX = \b(?<device>(?:naa|eui|t10)\.[0-9A-Za-z]+|mpx\.vmhba\d+:C\d+:T\d+:L\d+)

# First physical NIC in the message
[esxi_nic]
REGEX = \b(?<nic>vmnic\d+)\b

# Storage latency change (microseconds)
[esxi_latency]
REGEX = latency (?:increased|reduced) from (?:average value of )?(?<latency_from_us>\d+) ?(?:microseconds|\(us\)) to (?<latency_to_us>\d+)

# vmacore SSL exception text
[esxi_ssl_exception]
REGEX = SSL Exception: (?<ssl_error>[^)]+)\)

# vmacore 'e: <code>(<text>)' error
[esxi_ssl_errno]
REGEX = , e: \d+\((?<ssl_error>[^)]+)\)

# Firewall rule set change (Hostd event and vobd)
[esxi_firewall]
REGEX = Operation '(?<firewall_operation>\w+)' for rule set (?<firewall_ruleset>\S+?) succeeded

# SSH session opened/closed (Hostd event and vobd)
[esxi_ssh_session_event]
REGEX = SSH session was (?<session_action>opened|closed) for '(?<user>[^@']+)@(?<src>[^']+)'

# Long-running operations (VpxLRO) in Vpxa, Fdm and Hostd
[esxi_lro]
REGEX = \[VpxLRO\] -- (?<esxi_lro_state>BEGIN|FINISH|ERROR|CANCEL\w*) (?<esxi_lro_id>\S+)(?: -- (?<esxi_lro_object>\S*) -- (?<esxi_lro_method>\S+)(?: -- (?<esxi_lro_session>\S+))?)?

# Backup return code
[esxi_return_code]
REGEX = completed with rc = (?<return_code>-?\d+)

# Hostd password login, accepted or rejected (Authentication)
[esxi_hostd_password]
REGEX = \b(?<esxi_auth_result>Accepted|Rejected) password for user (?<user>\S+) from (?<src>[^\s]+?)(?: - session=(?<esxi_session>[\w-]+))?(?:#000)*$

# Hostd failed login event (Authentication)
[esxi_hostd_cannot_login]
REGEX = \] Event \d+ : (?<esxi_auth_result>Cannot login) (?<user>[^@\s]+)@(?<src>[^\s:]+)

# Hostd session login/logout event
[esxi_hostd_session]
REGEX = \] Event \d+ : User (?<user>[^@\s]+)@(?<src>\S+) logged (?<session_action>in|out)(?: as (?<user_agent>.+))?

# Hostd logout details
[esxi_hostd_logout_detail]
REGEX = logged out \(login time: (?<login_time>.+?), number of API invocations: (?<api_invocations>[\d,]+), user agent: (?<user_agent>.*)\)

# Hostd event: Event <n> : <text>
[esxi_hostd_event]
REGEX = \] Event (?<esxi_event_id>\d+) : (?<esxi_event_message>.*?)(?:#000)*$

# Hostd task: Task Created|Completed : haTask-<entity>-<type>.<method>-<n> [Status <s>] (Change)
[esxi_hostd_task]
REGEX = \] Task (?<esxi_task_state>Created|Completed) : (?<esxi_task_id>haTask-(?<esxi_task_entity>[\w-]*?)-(?<esxi_task_type>vim\.[\w.]+)\.(?<esxi_task_method>\w+)-\d+)(?: Status (?<esxi_task_status>\w+))?

# VM registered / removed / reconfigured
[esxi_hostd_vm_change]
REGEX = \] Event \d+ : (?<esxi_vm_action>Reconfigured|Registered|Removed) (?<vm_name>\S+) (?:on|from) 

# VM power state change
[esxi_hostd_vm_state]
REGEX = \] Event \d+ : (?<vm_name>\S+) on +\S+ in \S+ (?:has |is )(?<esxi_vm_action>powered on|powered off|starting|stopping|suspended|resumed|reset)

# VM disk consolidation
[esxi_hostd_vm_disks]
REGEX = \] Event \d+ : Virtual machine (?<vm_name>\S+) disks (?<esxi_vm_action>consolidated)

# Guest operation on a VM
[esxi_hostd_guest_op]
REGEX = \] Event \d+ : Guest operation (?<guest_operation>.+?) performed on Virtual machine (?<vm_name>\S+?)\.?(?:#000)*$

# Warning about a VM
[esxi_hostd_vm_warning]
REGEX = \] Event \d+ : Warning message on (?<vm_name>\S+) on 

# Guest customization result
[esxi_hostd_customization]
REGEX = \] Event \d+ : Customization of VM (?<vm_name>\S+) (?<esxi_vm_action>succeeded|failed)

# NFC (file copy) operation
[esxi_hostd_nfc]
REGEX = NFC operation '(?<nfc_operation>[^']+)' for path '(?<file_path>[^']+)' was initiated from '(?<src>[^']*)' and completed with status '(?<nfc_status>[^']+)'

# Datastore file upload/download
[esxi_hostd_file]
REGEX = File (?<nfc_operation>upload|download) (?:to|from) path '(?<file_path>[^']+)' was initiated from '(?:(?<user_agent>[^'@]*)@)?(?<src>[^']*)' and completed with status '(?<nfc_status>[^']+)'

# SSH login accepted / failed (Authentication)
[esxi_sshd_auth]
REGEX = sshd\[\d+\]: (?<esxi_auth_result>Accepted|Failed) (?<authentication_method>[\w/-]+) for (?:invalid user )?(?<user>\S+) from (?<src>\S+) port (?<src_port>\d+)

# SSH login with an unknown user (Authentication)
[esxi_sshd_invalid]
REGEX = sshd\[\d+\]: (?<esxi_auth_result>Invalid user) (?<user>\S*) ?from (?<src>\S+)(?: port (?<src_port>\d+))?

# SSH PAM authentication failure (Authentication)
[esxi_sshd_pam_failure]
REGEX = sshd\[\d+\]: error: PAM: (?<esxi_auth_result>Authentication failure) for (?:illegal user )?(?<user>\S+) from (?<src>\S+)

# SSH session opened / closed
[esxi_sshd_session]
REGEX = pam_unix\(sshd:session\): session (?<session_action>opened|closed) for user (?<user>\S+)

# Command run over SSH
[esxi_sshd_command]
REGEX = sshd\[\d+\]: User '(?<user>[^']+)' running command '(?<command>.*)'

# SSH connection
[esxi_sshd_connection]
REGEX = sshd\[\d+\]: Connection from (?<src>\S+) port (?<src_port>\d+)

# SSH disconnect
[esxi_sshd_disconnect]
REGEX = sshd\[\d+\]: (?:Disconnected from|Received disconnect from|Connection closed by)(?: (?:authenticating |invalid )?user (?<user>\S+))? (?<src>[\da-fA-F.:]+) port (?<src_port>\d+)

# Command run in the ESXi Shell
[esxi_shell_command]
REGEX = shell\[\d+\]: \[(?<user>[^\]]+)\]: (?<command>.+?)(?:#000)*$

# VMkernel observation: [correlator] <uptime>us: [esx.audit.x|esx.problem.x|vob.x] message
[esxi_vob]
REGEX = vobd: +\[(?<vob_correlator>\w+)\] (?<vob_time_us>\d+)us: \[(?<vob_id>(?<vob_source>esx|vob)\.(?<vob_type>\w+)\.[\w.]+)\] (?<vob_message>.*?)(?:#000)*$

# User in account events (lockouts, login failures, password changes)
[esxi_vob_account]
REGEX = \] .*?(?:for|of) (?:ESXi local )?user (?:account )?'?(?<user>[\w.@\\-]+?)'?(?: has|\.|$| )

# Envoy access log: method path status ... client:port protocol tls listener:port ... upstream "opID" "SOAP action" (Web)
[esxi_envoy_access]
REGEX = envoy-access\[\d+\]: (?<http_method>[A-Z]+) (?<uri_path>[^\s?]+)(?:\?(?<uri_query>\S*))? (?<status>\d{3}) (?<envoy_response_detail>\S+) (?<envoy_response_flags>\S+) (?<bytes_in>\d+) (?<bytes_out>\d+) (?<envoy_content_encoding>\S+) (?<duration>\d+) (?<envoy_upstream_time>\S+) \S+ (?<src>\[[^\]]+\]|[^\s:]+):(?<src_port>\d+) (?<http_version>\S+) (?<tls_version>\S+) (?<dest_ip>\[[^\]]+\]|[^\s:]+):(?<dest_port>\d+) (?<envoy_upstream_local>\S+) (?<envoy_upstream_protocol>\S+) \S+ (?<envoy_upstream_host>\S+)(?: \"(?<esxi_opid>[^\"]*)\"| -)?(?: \"(?<soap_action>[^\"]*)\"| -)?

# Envoy connection ID
[esxi_envoy_connection]
REGEX = \"ConnectionId\":\"(?<envoy_connection_id>\d+)\"

# Envoy TLS error with the client address
[esxi_envoy_tls]
REGEX = remote address:(?<remote_ip>[^,]+?):(?<remote_port>\d+),TLS_error:\|(?<tls_error>.*?):TLS_error_end

# Envoy closing a TLS connection
[esxi_envoy_closing]
REGEX = closing connection SSL<(?<remote_ip>[^,>]+?):(?<remote_port>\d+), (?<local_ip>[^,>]+?):(?<local_port>\d+)>

# Reverse proxy route
[esxi_rhttpproxy_endpoint]
REGEX = _serverNamespace = (?<rhttpproxy_namespace>\S+) action = (?<rhttpproxy_action>\S+) _port = (?<rhttpproxy_port>\d+)

# Reverse proxy request number
[esxi_rhttpproxy_req]
REGEX = sub=Proxy Req (?<rhttpproxy_req>\d+)

# vSphere HA (Fdm) cluster state
[esxi_fdm_cluster]
REGEX = hostId=(?<fdm_host_id>\S+) state=(?<fdm_state>\S+) master=(?<fdm_master>\S+) isolated=(?<fdm_isolated>\S+)

# VMkernel: cpu<n>:<world>[ opID=x])[WARNING: ]Module: [function:]line: message
[esxi_vmkernel]
REGEX = vmk(?:ernel|warning): cpu(?<cpu>\d+):(?<world_id>\d+)(?: opID=(?<esxi_opid>[^)]+))?\)(?:(?<log_level>WARNING): )?(?<vmk_module>[\w.-]+): (?:(?<vmk_function>[A-Za-z_]\w*):)?(?:(?<vmk_line>\d+): )?(?<vmk_message>.*?)(?:#000)*$

# Cron job started
[esxi_crond]
REGEX = crond\[\d+\]: (?:crond: )?USER (?<user>\S+) pid (?<cron_pid>\d+) cmd (?<command>.+?)(?:#000)*$

# Host uptime and VM count
[esxi_heartbeat]
REGEX = heartbeat(?:\[\d+\])?: up (?<uptime>\w+), (?<vm_count>\d+) VMs?;

# Memory statistics type
[esxi_vmkmemstats]
REGEX = vmkmemstats\[\d+\]: (?<memstats_type>[\w-]+-stats): 

# vSphere Cluster Services agent: LEVEL<tab>[source<tab>]message<tab>{json}
[esxi_cluster_agent]
REGEX = clusterAgent\[\d+\]: (?:\d{4}-\S+?#011)?(?<log_level>[A-Z]+)#011(?:(?<cluster_agent_source>[\w./-]+:\d+)#011)?(?<cluster_agent_message>[^#]+?)(?:#011(?<cluster_agent_detail>\{.*\}))?(?:#000)*$

# opID and request type from the agent's JSON
[esxi_cluster_agent_json]
REGEX = #011\{.*?\"opID\": \"(?<esxi_opid>[^\"]+)\"(?:.*?\"type\": \"(?<cluster_agent_type>[A-Z_]+)\")?

# Error text from the agent's JSON
[esxi_cluster_agent_error]
REGEX = \"error\": \"(?<cluster_agent_error>[^\"]*)\"

# etcd request
[esxi_etcd_request]
REGEX = time spent = (?<etcd_time_spent>[^,]+), remote = (?<remote_ip>[^,]+?):(?<remote_port>\d+), response type = (?<etcd_response_type>[^,]+)

# etcd rejected connection
[esxi_etcd_rejected]
REGEX = rejected connection from \"(?<remote_ip>[^\"]+?):(?<remote_port>\d+)\" \(error \"(?<etcd_error>[^\"]*)\"

# esxupdate: pid: module: LEVEL: message
[esxi_esxupdate]
REGEX = esxupdate: (?<pid>\d+): (?<esxupdate_module>[\w.]+): (?<log_level>[A-Z]+): 

# VIB being verified
[esxi_vib_hash]
REGEX = Verifying hash on vibid (?<vib_id>[^\s,]+)

# VIB signature being verified
[esxi_vib_signature]
REGEX = Verifying VIB (?<vib_id>\S+) signature

# VIB signature failure
[esxi_vib_error]
REGEX = Failed to verify VIB signature #\d+: \('(?<vib_id>[^']+)', '(?<vib_error>[^']+)'\)

# ImageConfigManager: [MainProcess LEVEL 'logger' thread]
[esxi_icm]
REGEX = \[MainProcess (?<log_level>[A-Z]+) '(?<icm_logger>[^']+)' (?<icm_thread>\w+)\]

# Host Profiles[pid opID=x]: LEVEL: message
[esxi_host_profiles]
REGEX = \[\d+ opID=(?<esxi_opid>[^\]]+)\]: (?<log_level>[A-Z]+): 

# Host profile trace: command and exit status
[esxi_hostprofiletrace]
REGEX = Command: (?<command>.+?), status: \((?<command_status>-?\d+)\)

# UCS tool: name : LEVEL : message
[esxi_ucs_tool]
REGEX = ucs-tool-esxi-\w+ : (?<log_level>[A-Z]+)\s+: 

# UCS tool command
[esxi_ucs_tool_command]
REGEX = Running command: (?<command>.+?)(?:#000)*$

# settingsd: level [Component:thread] message
[esxi_settingsd]
REGEX = settingsd\[\d+\]: (?<log_level>trivia|debug|info|warn|warning|error) \[(?<settingsd_component>[^:\]]+):

# lsud: [level] message
[esxi_lsud]
REGEX = lsud\[\d+\]: \[(?<log_level>\w+)\]

# HyperFlex IO visor: CATEGORY: LEVEL: module: message
[esxi_scvmclient]
REGEX = scvmclient\[[\d:]+\]: (?<scvm_category>[A-Z]+): (?<log_level>[A-Z]+): (?<scvm_module>[\w.]+): 

# Health plug-in status
[esxi_healthd_plugin]
REGEX = healthdPlugins(?:\[\d+\])?: (?<healthd_plugin>vmw\.\w+) (?<log_level>[A-Z]+) 

# vSAN management service: [opID=x Class::Method]
[esxi_vsand]
REGEX = vsand\[\d+\] \[opID=(?<esxi_opid>\S+) (?<esxi_function>[^\]]+)\]

# Likewise (AD join) component
[esxi_lwsmd_component]
REGEX = lwsmd(?:\[\d+\])?: \[(?<lwsmd_component>\w+)\] 

# Active Directory domain
[esxi_ad_domain]
REGEX = domain '(?<ad_domain>[^']+)'

# AD machine password change failure
[esxi_ad_password]
REGEX = machine password for (?<ad_domain>[\w.-]+) \(error = (?<ad_error>\d+)\)

# Domain controller found
[esxi_ad_dc_found]
REGEX = Found DC (?<ad_dc>\S+) \((?<ad_dc_ip>[^)]+)\)

# Domain controller response
[esxi_ad_dc_response]
REGEX = from DC response from (?<ad_dc>\S+) \((?<ad_dc_ip>[^)]+)\)

# NFC connection
[esxi_nfcd]
REGEX = Accepted connection from \[(?<src>[^\]]+)\]:(?<src_port>\d+)

# vmauthd connection
[esxi_vmauthd_socket]
REGEX = Connect from remote socket \((?<src>[^)]+):(?<src_port>\d+)\)

# vmauthd connection
[esxi_vmauthd_connect]
REGEX = vmauthd\[\d+\]: Connect from (?<src>[^\s(]+)(?:#000)*$

# vmauthd proxied service
[esxi_vmauthd_proxy]
REGEX = Received PROXY command for (?<vmauthd_service>\w+), session = (?<esxi_session>\S+)

# Token service: token created for a vCenter solution user
[esxi_token_create]
REGEX = Creating token for \[(?<token_issuer>[^,\]]+), (?<token_domain>[^,\]]+), (?<user>[^\]]+)\]

# Token service: user
[esxi_token_user]
REGEX = Parsed authData\.username: \"(?<user>[^\"]+)\"

# Token service: result
[esxi_token_result]
REGEX = MethodResult: MR \[(?<result>\w+)\]

# API method
[esxi_api_method]
REGEX = Invoke-MethodId: (?<api_method>\S+)

# API forwarder
[esxi_api_forward]
REGEX = (?:Forwarding to|Invoke for|Forward response from) (?<api_service>\S+)

# Dell iDRAC Service Module event
[esxi_ism]
REGEX = (?<ism_message_id>ISM\d+) \[iSM@[\d.]+ EventID=\"(?<ism_event_id>\d+)\" EventCategory=\"(?<ism_category>[^\"]+)\" EventSeverity=\"(?<ism_severity>[^\"]+)\"[^\]]*\] (?<ism_message>.*?)(?:#000)*$

# SSL connection error
[esxi_ssl_conn_error]
REGEX = SSL Connection error (?<ssl_error_code>\d+) : (?<ssl_error>.+?)(?:#000)*$

# Dell OpenManage Server Administrator: <n> <event ID> - <service>  <message>.:  <object>
[esxi_omsa]
REGEX = Server_Administrator: \d+ (?<omsa_event_id>\d+) - (?<omsa_service>.+?)  (?<omsa_message>.+?)(?:\.:\s+(?<omsa_object>.+?))?(?:#000)*$

# Watchdog started a service
[esxi_watchdog_started]
REGEX = Started (?<service>\S+) with PID=(?<service_pid>\d+)

# Watchdog restarting a service
[esxi_watchdog_restart]
REGEX = watchdog\[\d+\]: Restarting (?<service>\S+)
